app = "crewai-contact-center"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  LOG_LEVEL = "info"
  CREW_MAX_WORKERS = "4"
  LANGSMITH_PROJECT = "crewai-contact-center"
  LANGSMITH_TRACING = "true"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
